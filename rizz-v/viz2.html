<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RISC-V Trace Viz</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
    }

    .row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .muted {
      color: #666;
    }

    code {
      background: #f6f6f6;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .changed {
      font-weight: 700;
      outline: 2px solid #000;
      outline-offset: -2px;
      background: #fffbe6;
    }

    pre {
      margin: 0;
    }

    /* Arrow overlay */
    .regs-wrap {
      position: relative;
    }

    .arrow-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .arrow-path {
      fill: none;
      stroke: #000;
      stroke-width: 2;
      opacity: 0.35;
    }
  </style>
</head>

<body>
  <h2>Trace Visualizer</h2>

  <div class="controls card">
    <input type="file" id="fileInput" accept="application/json" />
    <button id="prevBtn">Prev</button>
    <button id="nextBtn">Next</button>
    <button id="playBtn">Play</button>

    <label class="muted">Step:</label>
    <input id="stepSlider" type="range" min="0" max="0" value="0" />
    <span id="stepLabel" class="muted"></span>

    <label class="muted">Speed (ms):</label>
    <input id="speedInput" type="number" value="400" min="50" step="50" style="width: 90px" />
  </div>

  <div class="row" style="margin-top: 16px">
    <div class="card" style="min-width: 320px; flex: 1 1 320px">
      <div><span class="muted">Instruction</span></div>
      <div id="instrLine" style="font-size: 18px; margin-top: 6px"></div>
      <pre id="instrJson" class="muted" style="margin-top: 10px; white-space: pre-wrap"></pre>
    </div>

    <div class="card" style="min-width: 520px; flex: 2 1 520px">
      <div><span class="muted">Registers</span></div>
      <div id="regsContainer" style="margin-top: 10px"></div>
    </div>
  </div>

  <script>
    // ABI-ish names for x0..x31
    const ABI = [
      "zero",
      "ra",
      "sp",
      "gp",
      "tp",
      "t0",
      "t1",
      "t2",
      "s0/fp",
      "s1",
      "a0",
      "a1",
      "a2",
      "a3",
      "a4",
      "a5",
      "a6",
      "a7",
      "s2",
      "s3",
      "s4",
      "s5",
      "s6",
      "s7",
      "s8",
      "s9",
      "s10",
      "s11",
      "t3",
      "t4",
      "t5",
      "t6",
    ];

    // Map Rust Register serialization (e.g. "T0") to x-index.
    const REG_TO_X = {
      ZERO: 0,
      RA: 1,
      SP: 2,
      GP: 3,
      TP: 4,
      T0: 5,
      T1: 6,
      T2: 7,
      S0: 8,
      FP: 8,
      S1: 9,
      A0: 10,
      A1: 11,
      A2: 12,
      A3: 13,
      A4: 14,
      A5: 15,
      A6: 16,
      A7: 17,
      S2: 18,
      S3: 19,
      S4: 20,
      S5: 21,
      S6: 22,
      S7: 23,
      S8: 24,
      S9: 25,
      S10: 26,
      S11: 27,
      T3: 28,
      T4: 29,
      T5: 30,
      T6: 31,
    };

    function regNameToIndex(regName) {
      if (typeof regName !== "string") return null;
      return Object.prototype.hasOwnProperty.call(REG_TO_X, regName)
        ? REG_TO_X[regName]
        : null;
    }

    let trace = null;
    let idx = 0;
    let timer = null;

    const el = (id) => document.getElementById(id);
    const prevBtn = el("prevBtn");
    const nextBtn = el("nextBtn");
    const playBtn = el("playBtn");
    const stepSlider = el("stepSlider");
    const stepLabel = el("stepLabel");
    const instrLine = el("instrLine");
    const instrJson = el("instrJson");
    const regsContainer = el("regsContainer");
    const speedInput = el("speedInput");

    // "instr": "Nil"
    // "instr": { "I": { op_code, rd, imm, (optional rs1) } }
    // "instr": { "R": { op_code, rd, rs1, rs2 } }
    function normalizeInstruction(instr) {
      if (typeof instr === "string") return {kind: instr};

      if (instr && typeof instr === "object") {
        const keys = Object.keys(instr);
        if (keys.length === 1) {
          const kind = keys[0];
          return {kind, data: instr[kind]};
        }
        if (Object.prototype.hasOwnProperty.call(instr, "Nil")) return {kind: "Nil"};
      }

      return {kind: "Unknown", raw: instr};
    }

    function formatInstr(instr) {
      const n = normalizeInstruction(instr);

      if (n.kind === "Nil") return "Nil";

      if (n.kind === "R") {
        const r = n.data || {};
        return `${r.op_code} ${r.rd}, ${r.rs1}, ${r.rs2}`;
      }

      if (n.kind === "I") {
        const i = n.data || {};
        if (i.rs1 !== undefined) return `${i.op_code} ${i.rd}, ${i.rs1}, ${i.imm}`;
        return `${i.op_code} ${i.rd}, ${i.imm}`;
      }

      if (n.data && typeof n.data === "object") {
        const fields = Object.entries(n.data)
          .map(([k, v]) => `${k}=${v}`)
          .join(", ");
        return `${n.kind} ${fields}`;
      }

      return "Unknown instruction";
    }

    function computeChangedRegs(prevRegs, curRegs) {
      if (!prevRegs) return new Set();
      const changed = new Set();
      for (let i = 0; i < curRegs.length; i++) {
        if (curRegs[i] !== prevRegs[i]) changed.add(i);
      }
      return changed;
    }

    // NEW: compute arrow endpoints (sources -> dest) based on current instruction
    function computeRegFlow(instr) {
      const n = normalizeInstruction(instr);

      // returns { sources: Set<xIndex>, dest: xIndex|null }
      const sources = new Set();
      let dest = null;

      if (n.kind === "R") {
        const r = n.data || {};
        dest = regNameToIndex(r.rd);
        const s1 = regNameToIndex(r.rs1);
        const s2 = regNameToIndex(r.rs2);
        if (s1 !== null) sources.add(s1);
        if (s2 !== null) sources.add(s2);
      } else if (n.kind === "I") {
        const i = n.data || {};
        dest = regNameToIndex(i.rd);
        const s1 = regNameToIndex(i.rs1); // optional in your current JSON
        if (s1 !== null) sources.add(s1);
      }

      if (dest !== null) sources.delete(dest); // avoid self-arrows
      return {sources, dest};
    }

    function clearArrows() {
      const svg = el("arrowSvg");
      if (svg) svg.remove();
    }

    function drawArrows({sources, dest}) {
      clearArrows();
      if (dest === null || sources.size === 0) return;

      const wrap = el("regsWrap");
      const grid = el("regsGrid");
      if (!wrap || !grid) return;

      const wrapRect = wrap.getBoundingClientRect();

      // Create SVG overlay sized to wrapper
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("id", "arrowSvg");
      svg.setAttribute("class", "arrow-layer");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("viewBox", `0 0 ${wrapRect.width} ${wrapRect.height}`);

      // Arrow head marker
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
      marker.setAttribute("id", "arrowHead");
      marker.setAttribute("markerWidth", "10");
      marker.setAttribute("markerHeight", "10");
      marker.setAttribute("refX", "8");
      marker.setAttribute("refY", "5");
      marker.setAttribute("orient", "auto");
      marker.setAttribute("markerUnits", "strokeWidth");

      const arrowShape = document.createElementNS("http://www.w3.org/2000/svg", "path");
      arrowShape.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
      arrowShape.setAttribute("fill", "#000");

      marker.appendChild(arrowShape);
      defs.appendChild(marker);
      svg.appendChild(defs);

      const destEl = el(`reg-${dest}`);
      if (!destEl) return;

      const dRect = destEl.getBoundingClientRect();
      const dx = dRect.left + dRect.width / 2 - wrapRect.left;
      const dy = dRect.top + dRect.height / 2 - wrapRect.top;

      // Draw a slightly curved path from each source to dest.
      for (const s of sources) {
        const srcEl = el(`reg-${s}`);
        if (!srcEl) continue;

        const sRect = srcEl.getBoundingClientRect();
        const sx = sRect.left + sRect.width / 2 - wrapRect.left;
        const sy = sRect.top + sRect.height / 2 - wrapRect.top;

        // Simple quadratic curve control point:
        // lift a bit upward (or downward) depending on relative y
        const midX = (sx + dx) / 2;
        const lift = sy <= dy ? -35 : 35;
        const ctrlY = (sy + dy) / 2 + lift;
        const ctrlX = midX;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "arrow-path");
        path.setAttribute("marker-end", "url(#arrowHead)");
        path.setAttribute("d", `M ${sx} ${sy} Q ${ctrlX} ${ctrlY} ${dx} ${dy}`);

        svg.appendChild(path);
      }

      wrap.appendChild(svg);
    }

    function render() {
      if (!trace) return;

      const states = trace.states || [];
      const state = states[idx];
      const prev = idx > 0 ? states[idx - 1] : null;

      stepSlider.value = idx;
      stepLabel.textContent = ` ${idx + 1} / ${states.length} (step=${state.step})`;

      instrLine.innerHTML = `<code>${formatInstr(state.instr)}</code>`;
      instrJson.textContent = JSON.stringify(state.instr, null, 2);

      const curRegs = state.reg_file.regs;
      const prevRegs = prev ? prev.reg_file.regs : null;
      const changed = computeChangedRegs(prevRegs, curRegs);

      // Render registers (6 per row) in a wrapper that can host the SVG overlay.
      let html = `
          <div id="regsWrap" class="regs-wrap">
            <div id="regsGrid" style="
              display: grid;
              grid-template-columns: repeat(6, minmax(110px, 1fr));
              gap: 10px;
            ">
        `;

      for (let i = 0; i < curRegs.length; i++) {
        const abi = ABI[i] ?? "?";
        const cls = changed.has(i) ? "changed" : "";

        html += `
            <div id="reg-${i}" class="${cls}" style="
              border: 1px solid #eee;
              border-radius: 10px;
              padding: 8px 10px;
              text-align: center;
              font-variant-numeric: tabular-nums;
            ">
              <div class="muted" style="font-size: 12px;">x${i} (${abi})</div>
              <div style="font-size: 16px;">${curRegs[i]}</div>
            </div>
          `;
      }

      html += `
            </div>
          </div>
        `;

      regsContainer.innerHTML = html;

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === states.length - 1;

      // Draw arrows after DOM has laid out (needs computed positions).
      const flow = computeRegFlow(state.instr);
      requestAnimationFrame(() => drawArrows(flow));
    }

    // Keep arrows correct on resize
    window.addEventListener("resize", () => {
      if (!trace) return;
      const state = trace.states[idx];
      const flow = computeRegFlow(state.instr);
      requestAnimationFrame(() => drawArrows(flow));
    });

    function stop() {
      if (timer) clearInterval(timer);
      timer = null;
      playBtn.textContent = "Play";
    }

    function play() {
      if (!trace) return;
      stop();

      const speedMs = Math.max(50, Number(speedInput.value) || 400);
      playBtn.textContent = "Pause";

      timer = setInterval(() => {
        if (idx >= trace.states.length - 1) {
          stop();
          return;
        }
        idx++;
        render();
      }, speedMs);
    }

    prevBtn.onclick = () => {
      stop();
      if (idx > 0) {
        idx--;
        render();
      }
    };

    nextBtn.onclick = () => {
      stop();
      if (trace && idx < trace.states.length - 1) {
        idx++;
        render();
      }
    };

    playBtn.onclick = () => {
      if (timer) stop();
      else play();
    };

    stepSlider.oninput = (e) => {
      stop();
      idx = Number(e.target.value);
      render();
    };

    el("fileInput").addEventListener("change", async (e) => {
      stop();
      const file = e.target.files?.[0];
      if (!file) return;

      const text = await file.text();
      trace = JSON.parse(text);

      idx = 0;
      stepSlider.min = 0;
      stepSlider.max = Math.max(0, (trace.states?.length || 1) - 1);

      render();
    });
  </script>
</body>

</html>
